{% set name = "evaluate" %}
{% set version = "0.4.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
    sha256: d721d9f2059ced79770d8a0509e954fbd1bbac96a8f9160e29888d8073cda3d9

build:
  number: 0
  entry_points:
    - evaluate-cli=evaluate.commands.evaluate_cli:main
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  # win skipped: this 0.4.1 backfill exists only for the axolotl 0.17.0 chain
  # (Linux/macOS; lm_eval already skips win), and the win-64 conda-build hits an
  # internal LoadLibrary error. Nothing on win needs evaluate ==0.4.1.
  skip: true  # [py<38 or win]

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - datasets >=2.0.0
    - numpy >=1.17
    - dill
    - pandas
    - requests >=2.19.0
    - tqdm >=4.62.1
    - python-xxhash
    - multiprocess
    - importlib-metadata  # [py<38]
    # fsspec[http]
    - fsspec >=2021.05.0
    - aiohttp
    # NOTE: unlike the 0.4.6 recipe we do NOT cap huggingface_hub <0.31 here.
    # 0.4.1's Repository import (removed in hf_hub 0.31) is only in evaluate-cli;
    # the library (evaluate.load / metrics) works with modern hf_hub. axolotl
    # 0.17.0 pins evaluate ==0.4.1 alongside transformers ==5.9.0 (which needs
    # huggingface_hub >=1.5.0), so an uncapped bound is required for them to
    # co-resolve. Upstream requires_dist is huggingface-hub >=0.7.0.
    - huggingface_hub >=0.7.0
    - packaging
    # responses is declared in 0.4.1's base dependencies (unused in the library,
    # but keep it so pip check passes). 0.13.x (noarch) satisfies <0.19.
    - responses <0.19

test:
  imports:
    - evaluate
  commands:
    - pip check
  # The full upstream pytest suite and `evaluate-cli --help` are intentionally
  # not run: both exercise the evaluate-cli / push-to-hub path that imports
  # huggingface_hub.Repository (removed in hf_hub 0.31). Running them would force
  # pinning huggingface_hub <0.31, which conflicts with transformers 5.9 in the
  # axolotl environment this build targets. The library import + pip check cover
  # the packaged, in-use surface.
  requires:
    - pip

about:
  home: https://github.com/huggingface/evaluate
  summary: HuggingFace community-driven open-source library of evaluation
  description: |
    Evaluate is a library that makes evaluating and comparing models and reporting their performance easier and more standardized.

    It currently contains:

      - implementations of dozens of popular metrics: the existing metrics cover a variety of tasks spanning from NLP to Computer Vision, and include dataset-specific metrics for datasets. With a simple command like `accuracy = load("accuracy")`, get any of these metrics ready to use for evaluating a ML model in any framework (Numpy/Pandas/PyTorch/TensorFlow/JAX).
      - comparisons and measurements: comparisons are used to measure the difference between models and measurements are tools to evaluate datasets.
      - an easy way of adding new evaluation modules to the 🤗 Hub: you can create new evaluation modules and push them to a dedicated Space in the 🤗 Hub with evaluate-cli create [metric name], which allows you to see easily compare different metrics and their outputs for the same sets of references and predictions.
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  doc_url: https://huggingface.co/docs/evaluate/index
  dev_url: https://github.com/huggingface/evaluate

extra:
  recipe-maintainers:
    - wietsedv
